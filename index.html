<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C12">
<meta name="description" content="Aurora — быстрый мессенджер с каналами, группами, историями и реакциями">
<title>Aurora — мессенджер</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aurora">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

    <span class="aurora-blob aurora-blob--1"></span>

    <span class="aurora-blob aurora-blob--3"></span>

  <script type="module" src="assets/js/app.js"></script>
